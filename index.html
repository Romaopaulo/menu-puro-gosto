<style>
/* Layout: o PDF original empilhado em colunas 9:16, com zonas PEDIR invisiveis por cima, barra inferior discreta e painel de pedido. */
:root{
  --bg:#1a0e0b; --ink:#fff3e0; --muted:#d3b7a3; --orange:#fe8d01; --yellow:#ffc20e;

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-snap-type:y proximity;scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.35;padding-bottom:76px}
button{font-family:inherit;cursor:pointer}
.stage{display:flex;flex-direction:column;align-items:center;gap:10px}
.page{position:relative;width:100%;width:min(100%,calc((100vh - 76px) * .5625));width:min(100%,calc((100dvh - 76px) * .5625));aspect-ratio:9/16;scroll-snap-align:center;background:#000;overflow:hidden;user-select:none;-webkit-user-select:none}
.page img{display:block;width:100%;height:100%;object-fit:fill;-webkit-user-drag:none;pointer-events:none}
.hs{position:absolute;margin:0;padding:0;border:0;background:transparent;border-radius:999px;-webkit-tap-highlight-color:transparent}
.hs::after{content:"";position:absolute;inset:-60% -30%}
.hs.s::after{inset:-170% -70%}
.hs:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.hs.pulse{animation:pulse .55s ease-out}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,194,14,.95)}100%{box-shadow:0 0 0 14px rgba(255,194,14,0)}}
.bd{position:absolute;right:-13px;top:50%;transform:translateY(-50%);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--maroon);color:#fff;font-size:10px;font-weight:800;line-height:17px;text-align:center;box-shadow:0 0 0 2px #fff;pointer-events:none}
.s .bd{right:-15px}
.link{position:absolute;display:block;background:transparent;border:0;border-radius:18px;-webkit-tap-highlight-color:transparent}
.link:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(26,14,11,.96);border-top:1px solid #3a211a;padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.bar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.nav{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.nb{width:42px;height:42px;border-radius:12px;border:1px solid #4a2b22;background:#2a1812;color:var(--ink);font-size:20px;line-height:1;display:grid;place-items:center}
.nb:disabled{opacity:.35;cursor:default}
.ind{height:42px;padding:0 12px;border-radius:12px;border:1px solid #4a2b22;background:#2a1812;color:var(--ink);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.cart{flex:1 1 auto;min-width:0;height:46px;border:0;border-radius:14px;background:var(--orange);color:#3b0f05;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px}
.cart .ct{min-width:22px;height:22px;border-radius:11px;background:var(--maroon);color:#fff;font-size:12px;display:grid;place-items:center;padding:0 6px}
.cart .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.cats{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(100% + 8px);width:min(260px,calc(100vw - 24px));background:var(--card);color:var(--card-ink);border-radius:16px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.cats button{display:flex;justify-content:space-between;width:100%;border:0;background:transparent;color:inherit;font-size:14px;font-weight:600;padding:11px 12px;border-radius:10px;text-align:left}
.cats button[aria-current="true"]{background:#ffe9c7;font-weight:800}
.cats span{color:#9b6a55;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);z-index:30;max-width:min(92vw,420px);background:#fffaf2;color:var(--card-ink);font-size:13px;font-weight:700;padding:10px 14px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.toast.on{opacity:1;transform:translate(-50%,0)}

.veil{position:fixed;inset:0;z-index:40;background:rgba(10,4,2,.66);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88dvh;max-height:88vh;max-height:88dvh;background:var(--card);color:var(--card-ink);border-radius:22px 22px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
.sh-h h2{margin:0;font-size:18px;font-weight:800;text-wrap:balance}
.x{width:38px;height:38px;border-radius:50%;border:0;background:#f1e2cc;color:var(--card-ink);font-size:20px;line-height:1}
.items{overflow:auto;padding:0 18px;display:flex;flex-direction:column}
.it{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it .nm{font-weight:700;font-size:15px;min-width:0}
.it .up{font-size:12px;color:#8a5a45;font-variant-numeric:tabular-nums}
.it .sub{font-weight:800;font-size:15px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ctl{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.step{display:flex;align-items:center;gap:4px;background:#f6e8d2;border-radius:12px;padding:3px}
.step button{width:36px;height:36px;border:0;border-radius:10px;background:#fff;color:var(--card-ink);font-size:20px;font-weight:800;line-height:1}
.step b{min-width:34px;text-align:center;font-size:16px;font-variant-numeric:tabular-nums}
.rm{border:0;background:transparent;color:#a3281a;font-size:13px;font-weight:700;padding:8px 4px;text-decoration:underline}
.empty{padding:20px 0 26px;color:#7a5242;font-size:14px}
.sh-f{padding:12px 18px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.tot span:first-child{font-size:13px;letter-spacing:.06em}
.tot span:last-child{font-size:24px;font-variant-numeric:tabular-nums}
.send{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:14px;background:#1fa855;color:#fff;font-weight:800;font-size:16px;letter-spacing:.03em;text-decoration:none;border:0}
.send[aria-disabled="true"]{background:#c9b9a4;color:#fff;pointer-events:none}
.note{margin:0;font-size:12px;color:#8a5a45;text-align:center}
.pick{display:flex;flex-direction:column;gap:10px;padding:2px 18px 20px}
.pick p{margin:0 0 2px;font-size:13px;color:#8a5a45}
.pick button{height:54px;border:2px solid var(--orange);border-radius:14px;background:#fff;color:var(--card-ink);font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.hs.pulse{animation:none}.toast{transition:none}}
</style>

  function sheetHead(title){
    var h=el('div','sh-h');h.appendChild(el('h2',null,title));
    var x=el('button','x','✕');x.type='button';x.setAttribute('aria-label','Fechar');x.addEventListener('click',closeVeil);h.appendChild(x);return h;
  }
  function openPick(p,key,btn){
    veil.textContent='';
    var sh=el('div','sheet');sh.setAttribute('role','dialog');sh.setAttribute('aria-modal','true');sh.setAttribute('aria-label','Escolher preço');
    sh.appendChild(sheetHead(p.n));
    var w=el('div','pick');w.appendChild(el('p',null,'Escolha o preço indicado no menu:'));
    p.p.forEach(function(v){var b=el('button',null,kz(v));b.type='button';b.addEventListener('click',function(){closeVeil();addItem(key,p.n,v,btn);});w.appendChild(b);});
    sh.appendChild(w);veil.appendChild(sh);openVeil('pick');
  }
  function message(){
    var L=['Olá, Puro Gosto! Gostaria de fazer o seguinte pedido:',''];
    cart.forEach(function(i,n){
      L.push((n+1)+'. '+i.name);
      L.push('   Quantidade: '+i.qty);
      L.push('   Preço unitário: '+kz(i.price));
      L.push('   Subtotal: '+kz(i.price*i.qty));
    });
    L.push('');L.push('TOTAL: '+kz(total()));L.push('');L.push('Aguardo a confirmação do meu pedido. Obrigado!');
    return L.join('\n');
  }
  function waUrl(){return 'https://wa.me/'+WA+'?text='+encodeURIComponent(message());}
  function renderCart(){
    veil.textContent='';
    var sh=el('div','sheet');sh.setAttribute('role','dialog');sh.setAttribute('aria-modal','true');sh.setAttribute('aria-label','O seu pedido');
    sh.appendChild(sheetHead('O seu pedido'));
    var box=el('div','items');
    if(!cart.length){box.appendChild(el('p','empty','Ainda não escolheu nenhum produto. Toque em PEDIR junto ao produto no menu.'));}
    cart.forEach(function(i){
      var r=el('div','it');
      var l=el('div');l.appendChild(el('div','nm',i.name));l.appendChild(el('div','up',kz(i.price)+' cada'));r.appendChild(l);
      r.appendChild(el('div','sub',kz(i.price*i.qty)));
      var c=el('div','ctl'),st=el('div','step');
      var m=el('button',null,'−');m.type='button';m.setAttribute('aria-label','Diminuir quantidade de '+i.name);
      m.addEventListener('click',function(){i.qty-=1;if(i.qty<=0)cart=cart.filter(function(z){return z!==i;});save();refresh();});
      var q=el('b',null,String(i.qty));q.setAttribute('aria-live','polite');
      var pl=el('button',null,'+');pl.type='button';pl.setAttribute('aria-label','Aumentar quantidade de '+i.name);
      pl.addEventListener('click',function(){i.qty+=1;save();refresh();});
      st.appendChild(m);st.appendChild(q);st.appendChild(pl);c.appendChild(st);
      var rm=el('button','rm','Remover');rm.type='button';rm.setAttribute('aria-label','Remover '+i.name);
      rm.addEventListener('click',function(){cart=cart.filter(function(z){return z!==i;});save();refresh();});
      c.appendChild(rm);r.appendChild(c);box.appendChild(r);
    });
    sh.appendChild(box);
    var f=el('div','sh-f'),t=el('div','tot');t.appendChild(el('span',null,'TOTAL'));t.appendChild(el('span',null,kz(total())));f.appendChild(t);
    var a=el('a','send','ENVIAR PEDIDO');
    if(cart.length){a.href=waUrl();a.target='_blank';a.rel='noopener';}else a.setAttribute('aria-disabled','true');
    a.id='sendBtn';f.appendChild(a);
    f.appendChild(el('p','note','O WhatsApp abre com o pedido pronto. Carregue em Enviar dentro do WhatsApp para concluir.'));
    sh.appendChild(f);veil.appendChild(sh);
  }
  function openCart(){renderCart();openVeil('cart');}
  document.getElementById('cartBtn').addEventListener('click',openCart);
  refresh();
  window.__pg={cart:function(){return cart;},message:message,waUrl:waUrl,total:total};
})();
</script>

</body>
</html>
